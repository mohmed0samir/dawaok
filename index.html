<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دواؤك — الصيدلية الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0b1120;
  --ink2: #1e2d45;
  --teal: #00c9a7;
  --teal-d: #00a589;
  --gold: #f5c842;
  --danger: #ff4d6d;
  --glass: rgba(255,255,255,0.04);
  --glass2: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.09);
  --text: #e8edf5;
  --muted: #7a8fa8;
  --card: #131f30;
  --card2: #1a2940;
  --r: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Tajawal', sans-serif;
  background: var(--ink);
  color: var(--text);
  min-height: 100vh;
  direction: rtl;
}

/* ── HEADER ── */
header {
  background: linear-gradient(135deg, #0d1b2e 0%, #0b2240 100%);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px);
}
.header-wrap {
  max-width: 1200px; margin: 0 auto;
  padding: 16px 24px;
  display: flex; align-items: center; gap: 16px;
}
.logo {
  font-size: 24px; font-weight: 900; color: var(--teal);
  letter-spacing: -1px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.logo-dot { color: var(--gold); }
.search-wrap {
  flex: 1;
  background: var(--glass2);
  border: 1px solid var(--border);
  border-radius: 30px;
  display: flex; align-items: center; overflow: hidden;
}
.search-wrap input {
  flex: 1; background: transparent; border: none; outline: none;
  padding: 12px 18px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 14px; text-align: right;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap button {
  background: var(--teal); border: none; padding: 10px 18px;
  color: white; cursor: pointer; font-size: 16px;
  transition: background .2s;
}
.search-wrap button:hover { background: var(--teal-d); }
.cart-fab {
  position: relative;
  background: var(--teal);
  border: none; border-radius: 14px;
  padding: 11px 20px;
  color: white; font-family: 'Tajawal', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all .2s; flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(0,201,167,.3);
}
.cart-fab:hover { background: var(--teal-d); transform: translateY(-1px); }
.badge {
  background: var(--gold); color: #000;
  border-radius: 50%; width: 20px; height: 20px;
  font-size: 11px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
}

/* ── HERO ── */
.hero {
  max-width: 1200px; margin: 28px auto; padding: 0 24px;
  background: linear-gradient(135deg, #062a4e 0%, #0a3d62 50%, #054a30 100%);
  border-radius: 24px; padding: 44px 48px;
  position: relative; overflow: hidden;
  border: 1px solid rgba(0,201,167,.2);
}
.hero::before {
  content: '💊';
  position: absolute; left: 40px; top: 50%;
  transform: translateY(-50%);
  font-size: 120px; opacity: .06;
}
.hero-glow {
  position: absolute; top: -60px; right: -60px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(0,201,167,.15) 0%, transparent 70%);
}
.hero h1 { font-size: 32px; font-weight: 900; line-height: 1.3; margin-bottom: 10px; }
.hero h1 span { color: var(--teal); }
.hero p { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
.hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-primary {
  background: var(--teal); color: white; border: none;
  padding: 13px 28px; border-radius: 30px;
  font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 20px rgba(0,201,167,.3);
}
.btn-primary:hover { background: var(--teal-d); transform: translateY(-2px); }
.btn-outline {
  background: transparent; color: var(--teal);
  border: 1.5px solid var(--teal);
  padding: 13px 28px; border-radius: 30px;
  font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .2s;
}
.btn-outline:hover { background: rgba(0,201,167,.1); }

/* ── SECTIONS ── */
.section { max-width: 1200px; margin: 0 auto 36px; padding: 0 24px; }
.section-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.section-title {
  font-size: 19px; font-weight: 800;
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: '';
  width: 4px; height: 22px;
  background: linear-gradient(to bottom, var(--teal), var(--gold));
  border-radius: 4px;
}

/* ── CATEGORIES ── */
.cats-scroll {
  display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: none;
}
.cats-scroll::-webkit-scrollbar { display: none; }
.cat-chip {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 10px 18px;
  white-space: nowrap; cursor: pointer;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 7px;
  transition: all .2s;
  flex-shrink: 0;
}
.cat-chip:hover, .cat-chip.active {
  background: var(--teal); border-color: var(--teal); color: white;
}

/* ── PRODUCTS ── */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.product-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  transition: all .25s; cursor: pointer;
  position: relative;
}
.product-card:hover {
  border-color: var(--teal);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,201,167,.12);
}
.product-img {
  height: 150px;
  background: var(--card2);
  display: flex; align-items: center; justify-content: center;
  font-size: 60px; position: relative;
}
.product-badge {
  position: absolute; top: 10px; right: 10px;
  background: var(--danger); color: white;
  font-size: 11px; font-weight: 800;
  padding: 3px 9px; border-radius: 20px;
}
.product-badge.new { background: var(--gold); color: #000; }
.product-body { padding: 14px; }
.product-brand { font-size: 11px; color: var(--teal); font-weight: 700; margin-bottom: 4px; }
.product-name { font-size: 14px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
.product-foot { display: flex; align-items: center; justify-content: space-between; }
.product-price { font-size: 18px; font-weight: 900; color: var(--gold); }
.product-old { font-size: 12px; color: var(--muted); text-decoration: line-through; }
.add-btn {
  background: var(--teal); border: none;
  width: 34px; height: 34px; border-radius: 10px;
  color: white; font-size: 20px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.add-btn:hover { background: var(--teal-d); transform: scale(1.1); }
.out-of-stock { opacity: .4; pointer-events: none; }
.out-badge {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.7); color: var(--danger);
  text-align: center; font-size: 12px; font-weight: 700;
  padding: 6px;
}

/* ── CART DRAWER ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.drawer {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 420px; max-width: 100%;
  background: var(--ink2); border-right: 1px solid var(--border);
  z-index: 201; transform: translateX(-100%);
  transition: transform .35s cubic-bezier(.4, 0, .2, 1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.drawer-head h2 { font-size: 18px; font-weight: 800; }
.close-btn {
  background: var(--glass2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 10px;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; }
.cart-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.ci-thumb {
  width: 44px; height: 44px; border-radius: 8px;
  background: var(--card2); font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ci-info { flex: 1; }
.ci-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; line-height: 1.4; }
.ci-price { font-size: 14px; font-weight: 800; color: var(--gold); }
.ci-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.ci-btn {
  background: var(--card2); border: 1px solid var(--border);
  color: var(--text); width: 28px; height: 28px; border-radius: 8px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ci-btn:hover { border-color: var(--teal); color: var(--teal); }
.ci-qty { font-size: 14px; font-weight: 800; min-width: 16px; text-align: center; }

.cart-foot {
  padding: 20px 24px; border-top: 1px solid var(--border);
  background: rgba(11,17,32,0.4);
}
.cart-total-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; font-size: 15px; font-weight: 700;
}
.cart-total-row .val { font-size: 20px; font-weight: 900; color: var(--gold); }
.cart-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.cart-input {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 14px;
  color: var(--text); font-family: 'Tajawal', sans-serif;
  font-size: 13px; outline: none; width: 100%; transition: border .2s;
}
.cart-input:focus { border-color: var(--teal); }
.checkout-btn {
  width: 100%; background: var(--teal); color: white;
  border: none; border-radius: 12px; padding: 14px;
  font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: background .2s;
  box-shadow: 0 4px 16px rgba(0,201,167,.2);
}
.checkout-btn:hover { background: var(--teal-d); }
.cart-empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }

/* ── FOOTER ── */
footer {
  background: #070d19; border-top: 1px solid var(--border);
  padding: 24px; text-align: center; color: var(--muted); font-size: 13px;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--card2); color: var(--text); border: 1px solid var(--border);
  padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 700;
  z-index: 1000; transition: transform .3s cubic-bezier(.4, 0, .2, 1);
  box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .header-wrap { padding: 12px 16px; gap: 12px; }
  .logo { font-size: 20px; }
  .search-wrap input { padding: 10px 14px; font-size: 13px; }
  .cart-fab { padding: 10px 14px; font-size: 13px; }
  .hero { padding: 28px 24px; margin: 16px auto; border-radius: 16px; }
  .hero h1 { font-size: 24px; }
  .hero::before { display: none; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .product-img { height: 120px; font-size: 44px; }
  .product-name { font-size: 13px; margin-bottom: 6px; }
  .product-price { font-size: 15px; }
  .drawer { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <div class="logo">دواؤك<span class="logo-dot">.</span></div>
    <div class="search-wrap">
      <input type="text" id="searchInp" placeholder="ابحث عن دواء، فيتامين، مستلزمات..." oninput="searchProducts()">
    </div>
    <button class="cart-fab" onclick="openCart()">
      السلة
      <span class="badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<div class="hero">
  <div class="hero-glow"></div>
  <h1>صيدليتك الإلكترونية <span>الذكية الأولى</span></h1>
  <p>اطلب أدويتك ومستلزماتك الطبية بكل سهولة وأمان، تصلك أينما كنت وفي أسرع وقت.</p>
  <div class="hero-btns">
    <button class="btn-primary" onclick="scrollToProducts()">تصفح المنتجات</button>
  </div>
</div>

<div class="section">
  <div class="cats-scroll" id="catsContainer"></div>
</div>

<div class="section">
  <div class="section-hd">
    <div class="section-title" id="secTitle">كل المنتجات</div>
  </div>
  <div class="products-grid" id="productsContainer"></div>
</div>

<footer>
  <p>&copy; 2026 دواؤك — جميع الحقوق محفوظة.</p>
</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>سلة المشتريات</h2>
    <button class="close-btn" onclick="closeCart()">&times;</button>
  </div>
  <div class="cart-items" id="cartItemsContainer"></div>
  <div class="cart-foot" id="cartFoot">
    <div class="cart-total-row">
      <span>إجمالي الطلب:</span>
      <span class="val" id="cartTotalVal">0 جنيه</span>
    </div>
    <div class="cart-form">
      <input type="text" id="custName" class="cart-input" placeholder="الاسم الكامل">
      <input type="text" id="custPhone" class="cart-input" placeholder="رقم الهاتف">
      <input type="text" id="custAddress" class="cart-input" placeholder="العنوان بالتفصيل">
    </div>
    <button class="checkout-btn" onclick="placeOrder()">تأكيد وإرسال الطلب عبر الواتساب</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAs7...",
  authDomain: "dawa0k-eb375.firebaseapp.com",
  projectId: "dawa0k-eb375",
  storageBucket: "dawa0k-eb375.appspot.com",
  messagingSenderId: "367375620921",
  appId: "1:367375620921:web:ca423bb006a8e63b65f4ff"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const { collection, addDoc, serverTimestamp, query, where, getDocs } = firebase.firestore;

<script>
let allProducts = [];
let cart = [];
let currentCategory = 'الكل';

// Load initial categories & products from hardcoded script block for speed, 
// then refresh from DB dynamically if online.
const localProducts = [
    {name:'بنادول أدفانس 24 قرص',brand:'Panadol',category:'أدوية',price:45,stock:150,discount:0,isNew:false,emoji:'💊'},
    {name:'كونجستال 20 قرص',brand:'Congestal',category:'أدوية',price:36,stock:200,discount:0,isNew:false,emoji:'💊'},
    {name:'بروفين 400 ملجم – 30 قرص',brand:'Abbott',category:'أدوية',price:85,stock:200,discount:20,isNew:false,emoji:'🌿'},
    {name:'فيتامين D3 5000 IU – 90 قرص',brand:'Solgar',category:'فيتامينات',price:320,stock:80,discount:0,isNew:true,emoji:'🌿'},
    {name:'أوميجا 3 – 60 كبسولة',brand:'Vitalife',category:'فيتامينات',price:180,stock:100,discount:15,isNew:false,emoji:'🌿'},
    {name:'واقي شمس SPF 50+ – 88 مل',brand:'Neutrogena',category:'عناية بالبشرة',price:280,stock:60,discount:18,isNew:false,emoji:'🧴'},
    {name:'كريم مرطب CeraVe – 250 مل',brand:'CeraVe',category:'عناية بالبشرة',price:320,stock:50,discount:15,isNew:false,emoji:'🧴'},
    {name:'حليب أطفال نان 1 – 400 جرام',brand:'NAN',category:'صحة الطفل',price:195,stock:80,discount:0,isNew:false,emoji:'🍼'},
    {name:'جهاز قياس ضغط الدم',brand:'A&D Medical',category:'مستلزمات طبية',price:850,stock:20,discount:20,isNew:false,emoji:'🩺'},
    {name:'جهاز قياس السكر فى الدم',brand:'OneTouch',category:'مستلزمات طبية',price:620,stock:15,discount:10,isNew:false,emoji:'🩺'}
];

async function init() {
  loadCart();
  renderCats();
  try {
    const snap = await firebase.firestore().collection('products').get();
    if(!snap.empty) {
      allProducts = [];
      snap.forEach(doc => allProducts.push({id:doc.id, ...doc.data()}));
    } else {
      allProducts = localProducts;
    }
  } catch(e) {
    console.error("DB error, fallback to local:", e);
    allProducts = localProducts;
  }
  renderProducts();
}

function renderCats() {
  const cats = ['الكل', 'أدوية', 'فيتامينات', 'عناية بالبشرة', 'صحة الطفل', 'مستلزمات طبية'];
  const container = document.getElementById('catsContainer');
  container.innerHTML = cats.map(c => `
    <div class="cat-chip ${c===currentCategory?'active':''}" onclick="setCategory('${c}')">
      ${c}
    </div>
  `).join('');
}

window.setCategory = (cat) => {
  currentCategory = cat;
  renderCats();
  document.getElementById('secTitle').innerText = cat === 'الكل' ? 'كل المنتجات' : cat;
  renderProducts();
};

function renderProducts(filterItems = null) {
  const container = document.getElementById('productsContainer');
  let items = filterItems || allProducts;
  
  if (!filterItems && currentCategory !== 'الكل') {
    items = items.filter(p => p.category === currentCategory);
  }

  if(!items.length) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">لا توجد منتجات متوفرة حالياً.</div>`;
    return;
  }

  container.innerHTML = items.map(p => {
    const isOut = p.stock <= 0;
    const finalPrice = p.discount ? Math.round(p.price * (1 - p.discount/100)) : p.price;
    return `
      <div class="product-card ${isOut?'out-of-stock':''}">
        <div class="product-img">
          ${p.imgUrl ? `<img src="${p.imgUrl}" style="width:100%;height:100%;object-fit:contain;padding:8px;">` : `<span>${p.emoji||'📦'}</span>`}
          ${p.discount && !isOut ? `<span class="product-badge">خصم ${p.discount}%</span>` : ''}
          ${p.isNew && !p.discount && !isOut ? `<span class="product-badge new">جديد</span>` : ''}
          ${isOut ? `<span class="out-badge">نفذت الكمية</span>` : ''}
        </div>
        <div class="product-body">
          <div class="product-brand">${p.brand || 'عام'}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-foot">
            <div>
              <span class="product-price">${finalPrice} ج</span>
              ${p.discount ? `<span class="product-old">${p.price} ج</span>` : ''}
            </div>
            ${!isOut ? `<button class="add-btn" onclick="addToCart('${p.name.replace(/'/g, "\\'")}')">+</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

window.searchProducts = () => {
  const q = document.getElementById('searchInp').value.trim().toLowerCase();
  if(!q) { renderProducts(); return; }
  const res = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.brand && p.brand.toLowerCase().includes(q)));
  renderProducts(res);
};

window.scrollToProducts = () => {
  document.getElementById('secTitle').scrollIntoView({ behavior: 'smooth' });
};

// ── CART FUNCTIONS ──
window.addToCart = (name) => {
  const prod = allProducts.find(p => p.name === name);
  if(!prod) return;
  const existing = cart.find(x => x.name === name);
  const finalPrice = prod.discount ? Math.round(prod.price * (1 - prod.discount/100)) : prod.price;
  
  if(existing) {
    if(existing.qty >= prod.stock) { toast('⚠️ عذراً، لا تتوفر كمية أكبر في المخزن'); return; }
    existing.qty++;
  } else {
    cart.push({ name: prod.name, price: finalPrice, qty: 1, emoji: prod.emoji||'📦' });
  }
  saveCart();
  updateCartUI();
  toast('🛒 تم إضافة المنتج للسلة');
};

function saveCart() { localStorage.setItem('dawa0k_cart', JSON.stringify(cart)); }
function loadCart() { const stored = localStorage.getItem('dawa0k_cart'); if(stored) cart = JSON.parse(stored); updateCartUI(); }

function updateCartUI() {
  const totalQty = cart.reduce((s,x) => s + x.qty, 0);
  document.getElementById('cartBadge').innerText = totalQty;
  
  const container = document.getElementById('cartItemsContainer');
  if(!cart.length) {
    container.innerHTML = `<div class="cart-empty">السلة فارغة حالياً 🤔</div>`;
    document.getElementById('cartFoot').style.display = 'none';
    return;
  }
  document.getElementById('cartFoot').style.display = 'block';

  container.innerHTML = cart.map(x => `
    <div class="cart-item">
      <div class="ci-thumb">${x.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${x.name}</div>
        <div class="ci-price">${x.price * x.qty} جنيه</div>
      </div>
      <div class="ci-ctrl">
        <button class="ci-btn" onclick="changeQty('${x.name.replace(/'/g, "\\'")}', -1)">-</button>
        <span class="ci-qty">${x.qty}</span>
        <button class="ci-btn" onclick="changeQty('${x.name.replace(/'/g, "\\'")}', 1)">+</button>
      </div>
    </div>
  `).join('');

  const totalAmount = cart.reduce((s,x) => s + x.price*x.qty, 0);
  document.getElementById('cartTotalVal').innerText = totalAmount + ' جنيه';
}

window.changeQty = (name, d) => {
  const idx = cart.findIndex(x => x.name === name);
  if(idx === -1) return;
  cart[idx].qty += d;
  if(cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
  updateCartUI();
};

window.openCart = () => {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
};

window.closeCart = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
};

// ── PLACE ORDER ──
window.placeOrder = async () => {
  const name    = document.getElementById('custName').value.trim();
  const phone   = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if (!name || !phone || !address) { toast('⚠️ اكتب اسمك وهاتفك وعنوانك'); return; }
  if (!cart.length) { toast('⚠️ السلة فارغة'); return; }

  const total = cart.reduce((s,x) => s + x.price*x.qty, 0);
  const orderId = 'ORD-' + Date.now();

  try {
    const ref = await addDoc(collection(db, 'orders'), {\n      orderId,\n      customer: { name, phone, address },\n      items: cart,\n      total,\n      status: 'pending',\n      createdAt: serverTimestamp()\n    });

    // save invoice info for invoice.html
    cart = [];
    saveCart();
    closeCart();
    toast('🎉 تم إرسال طلبك بنجاح!');

    setTimeout(() => {
      window.location.href = 'https://dawa0k.vercel.app/%D9%81%D8%A7%D8%AA%D9%88%D8%B1%D9%87.html?order=' + ref.id;
    }, 1200);

  } catch(e) {
    console.error(e);
    toast('❌ حصل خطأ، اعد المحاولة');
  }
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.onload = init;
</script>
</body>
</html>
