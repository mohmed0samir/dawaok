  <symbol id="icon-map-pin" viewBox="0 0 24 24">

<style>
.icon { width: 20px; height: 20px; fill: currentColor; vertical-align: middle; margin-left: 6px; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-md { width: 24px; height: 24px; }
</style>

  <main class="shell">
    <header>
      <a href="./" class="brand"><svg class="icon icon-md" href="#icon-cross"></svg> Dawaok <small>دواوك</small></a>
      <a href="./" class="home">الموقع العام</a>
    </header>

    <section class="intro">
      <svg class="icon icon-md" href="#icon-truck"></svg>
      <div>
        <h1>بوابة التوصيل</h1>
        <p>اعرض الطلبات المسندة إليك وحدّث رحلة التوصيل خطوة بخطوة.</p>
      </div>
    </section>

    <section class="login" id="courierLogin">
      <h2>تسجيل دخول المندوب</h2>
      <p>استخدم بيانات الدخول التي أنشأها لك الأدمن.</p>
      <input id="courierEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="courierPassword" type="password" placeholder="كلمة المرور">
      <button onclick="startDelivery()">دخول إلى طلباتي</button>
    </section>

    <section id="deliveryApp" hidden>
      <div class="toolbar">
        <div>
          <b id="courierTitle"></b>
          <small id="ordersCount"></small>
        </div>
        <button class="outline" onclick="logoutDelivery()"><svg class="icon icon-sm" href="#icon-logout"></svg> خروج</button>
      </div>
      <div id="orders" class="orders"><div class="empty"><svg class="icon icon-md" href="#icon-spinner"></svg> جاري تحميل طلباتك…</div></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/delivery.js"></script>
</body>
</html>
