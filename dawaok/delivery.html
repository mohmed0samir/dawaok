<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بوابة المندوب | Dawaok</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/delivery.css">
</head>
<body>
  <main class="shell">
    <header><a href="./" class="brand"><b>✚</b> Dawaok <small>دواوك</small></a><a href="./" class="home">الموقع العام</a></header>
    <section class="intro"><span>🚚</span><div><h1>بوابة التوصيل</h1><p>اعرض الطلبات المسندة إليك وحدّث رحلة التوصيل خطوة بخطوة.</p></div></section>
    <section class="login" id="courierLogin"><h2>تسجيل دخول المندوب</h2><p>استخدم بيانات الدخول التي أنشأها لك الأدمن.</p><input id="courierEmail" type="email" placeholder="البريد الإلكتروني"><input id="courierPassword" type="password" placeholder="كلمة المرور"><button onclick="startDelivery()">دخول إلى طلباتي</button></section>
    <section id="deliveryApp" hidden><div class="toolbar"><div><b id="courierTitle"></b><small id="ordersCount"></small></div><button class="outline" onclick="logoutDelivery()">خروج</button></div><div id="orders" class="orders"><div class="empty">جاري تحميل طلباتك…</div></div></section>
  </main>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/delivery.js"></script>
</body>
</html>
